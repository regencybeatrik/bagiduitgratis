<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 SELAMAT - XNX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(145deg,#0a0a1a,#1a1a2e);font-family:Arial;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#fff}
.card{background:rgba(20,20,40,0.9);backdrop-filter:blur(10px);border-radius:30px;padding:40px 30px;max-width:500px;width:100%;text-align:center;border:2px solid #ffcc00;box-shadow:0 0 60px rgba(255,204,0,0.2);position:relative;overflow:hidden}
.card::before{content:'🎉';position:absolute;top:-20px;right:-20px;font-size:80px;opacity:0.1;transform:rotate(20deg)}
.emoji-big{font-size:70px;display:block;margin-bottom:15px}
h1{font-size:28px;color:#ffcc00;text-shadow:0 0 30px #ffcc0044;margin-bottom:10px}
.sub{color:#aaa;font-size:14px;margin-bottom:20px}
.prize-box{background:#1a1a30;border-radius:20px;padding:25px;margin:20px 0;border:2px dashed #ffcc00}
.prize-box .amount{font-size:42px;font-weight:bold;color:#ffcc00;text-shadow:0 0 20px #ffcc0066}
.prize-box .label{color:#888;font-size:12px;text-transform:uppercase;letter-spacing:2px}
.btn-withdraw{background:#ffcc00;color:#000;border:none;padding:18px 50px;border-radius:50px;font-size:22px;font-weight:bold;cursor:pointer;transition:0.3s;box-shadow:0 0 40px rgba(255,204,0,0.3);width:100%;margin:15px 0}
.btn-withdraw:hover{transform:scale(1.03);box-shadow:0 0 60px rgba(255,204,0,0.5)}
.btn-withdraw:active{transform:scale(0.97)}
.btn-withdraw.loading{opacity:0.7;pointer-events:none}
#status{margin:15px 0;padding:12px;border-radius:12px;background:#111;color:#888;font-size:14px;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #222}
#status.success{color:#00ff88;border-color:#00ff8844}
#status.error{color:#ff3366;border-color:#ff336644}
#status.info{color:#66ccff;border-color:#66ccff44}
.footer{margin-top:20px;font-size:11px;color:#333}
</style>
</head>
<body>
<div class="card">
<span class="emoji-big">🎊</span>
<h1>SELAMAT!</h1>
<p class="sub">Anda terpilih sebagai pemenang undian spesial</p>
<div class="prize-box">
<div class="label">Total Hadiah</div>
<div class="amount">Rp 10.000.000</div>
<div style="margin-top:8px;font-size:12px;color:#666;">💰 Telah ditransfer ke akun Anda</div>
</div>
<button class="btn-withdraw" id="withdrawBtn">💸 WITHDRAW</button>
<div id="status">🟢 Klik tombol untuk klaim hadiah</div>
<div class="footer">© XNX SYSTEM • Verifikasi keamanan</div>
</div>
<script>
document.getElementById('withdrawBtn').addEventListener('click',function(e){
e.preventDefault();
const status=document.getElementById('status');
status.textContent='✅ Proses klaim berhasil! Hadiah akan dikirim.';
status.className='success';
});
</script>
</body>
</html>
